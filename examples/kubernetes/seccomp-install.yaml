# Instructions for installing seccomp profiles on Kubernetes nodes
# 
# Option 1: Copy profiles to each node
# Copy the seccomp profiles to /var/lib/kubelet/seccomp/profiles/ on each node:
#   sudo mkdir -p /var/lib/kubelet/seccomp/profiles
#   sudo cp config/seccomp/init-container.json /var/lib/kubelet/seccomp/profiles/lokey-client-init-container.json
#   sudo cp config/seccomp/client-container.json /var/lib/kubelet/seccomp/profiles/lokey-client-container.json
#
# Option 2: Use ConfigMap (recommended for managed Kubernetes)
# See seccomp-configmap.yaml for ConfigMap-based approach

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lokey-client-seccomp-profiles
  namespace: kube-system
data:
  init-container.json: |
    {
      "defaultAction": "SCMP_ACT_ERRNO",
      "architectures": [
        "SCMP_ARCH_X86_64",
        "SCMP_ARCH_X86",
        "SCMP_ARCH_X32",
        "SCMP_ARCH_ARM",
        "SCMP_ARCH_AARCH64"
      ],
      "syscalls": [
        {
          "names": [
            "mknod",
            "mknodat",
            "mkdir",
            "mkdirat",
            "open",
            "openat",
            "close",
            "stat",
            "fstat",
            "lstat",
            "statfs",
            "fstatfs",
            "unlink",
            "unlinkat",
            "chmod",
            "fchmod",
            "fchmodat",
            "access",
            "faccessat",
            "readlink",
            "readlinkat",
            "getcwd",
            "chdir",
            "fchdir",
            "exit",
            "exit_group",
            "rt_sigreturn",
            "sigreturn",
            "write",
            "writev",
            "read",
            "readv",
            "getpid",
            "getppid",
            "getuid",
            "geteuid",
            "getgid",
            "getegid",
            "getgroups",
            "getresuid",
            "getresgid",
            "arch_prctl",
            "set_tid_address",
            "set_robust_list",
            "futex",
            "clock_gettime",
            "clock_getres",
            "nanosleep",
            "gettimeofday",
            "time",
            "restart_syscall"
          ],
          "action": "SCMP_ACT_ALLOW"
        }
      ]
    }
  client-container.json: |
    {
      "defaultAction": "SCMP_ACT_ERRNO",
      "architectures": [
        "SCMP_ARCH_X86_64",
        "SCMP_ARCH_X86",
        "SCMP_ARCH_X32",
        "SCMP_ARCH_ARM",
        "SCMP_ARCH_AARCH64"
      ],
      "syscalls": [
        {
          "names": [
            "open",
            "openat",
            "close",
            "read",
            "readv",
            "pread64",
            "write",
            "writev",
            "pwrite64",
            "stat",
            "fstat",
            "lstat",
            "statfs",
            "fstatfs",
            "access",
            "faccessat",
            "getcwd",
            "chdir",
            "fchdir",
            "socket",
            "socketpair",
            "connect",
            "accept",
            "accept4",
            "sendto",
            "recvfrom",
            "sendmsg",
            "recvmsg",
            "shutdown",
            "bind",
            "listen",
            "getsockname",
            "getpeername",
            "setsockopt",
            "getsockopt",
            "fcntl",
            "fcntl64",
            "epoll_create",
            "epoll_create1",
            "epoll_ctl",
            "epoll_pwait",
            "epoll_wait",
            "poll",
            "ppoll",
            "select",
            "pselect6",
            "ioctl",
            "io_setup",
            "io_destroy",
            "io_getevents",
            "io_submit",
            "io_cancel",
            "getdents",
            "getdents64",
            "readlink",
            "readlinkat",
            "exit",
            "exit_group",
            "rt_sigreturn",
            "sigreturn",
            "rt_sigaction",
            "rt_sigprocmask",
            "rt_sigpending",
            "rt_sigtimedwait",
            "rt_sigqueueinfo",
            "rt_sigsuspend",
            "sigaltstack",
            "getpid",
            "getppid",
            "getuid",
            "geteuid",
            "getgid",
            "getegid",
            "getgroups",
            "getresuid",
            "getresgid",
            "arch_prctl",
            "set_tid_address",
            "set_robust_list",
            "futex",
            "clock_gettime",
            "clock_getres",
            "clock_nanosleep",
            "nanosleep",
            "gettimeofday",
            "time",
            "restart_syscall",
            "clone",
            "clone3",
            "execve",
            "execveat",
            "wait4",
            "waitid",
            "prctl",
            "setns",
            "unshare",
            "setrlimit",
            "getrlimit",
            "prlimit64",
            "madvise",
            "mprotect",
            "mlock",
            "munlock",
            "mlockall",
            "munlockall",
            "mmap",
            "mmap2",
            "munmap",
            "mremap",
            "msync",
            "mincore",
            "brk",
            "getrandom",
            "memfd_create"
          ],
          "action": "SCMP_ACT_ALLOW"
        }
      ]
    }
