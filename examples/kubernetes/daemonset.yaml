apiVersion: v1
kind: Namespace
metadata:
  name: lokey-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lokey-client
  namespace: lokey-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lokey-client
  namespace: lokey-system
  labels:
    app: lokey-client
spec:
  selector:
    matchLabels:
      app: lokey-client
  template:
    metadata:
      labels:
        app: lokey-client
    spec:
      serviceAccountName: lokey-client
      hostNetwork: true
      hostPID: true
      containers:
      - name: lokey-client
        image: ghcr.io/lokey/client-container:latest
        env:
        - name: LOKEY_VIRTIO_URL
          value: "http://lokey-virtio.lokey-system.svc.cluster.local:8083"
        - name: LOKEY_STREAM_ENDPOINT
          value: "/stream"
        - name: DEVICE_PATH
          value: "/dev/lokeyrng,/dev/hwrng"
        - name: CHUNK_SIZE
          value: "1024"
        - name: RECONNECT_INTERVAL
          value: "5s"
        - name: LOG_LEVEL
          value: "INFO"
        volumeMounts:
        - name: dev
          mountPath: /dev
        securityContext:
          privileged: true
          runAsUser: 0
          seccompProfile:
            type: Localhost
            localhostProfile: lokey-client-container.json
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: dev
        hostPath:
          path: /dev
          type: Directory
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: lokey-virtio
  namespace: lokey-system
spec:
  selector:
    app: lokey-virtio
  ports:
  - port: 8083
    targetPort: 8083
