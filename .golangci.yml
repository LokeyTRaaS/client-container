version: "2"

run:
  timeout: 5m
  tests: false

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are enabled by default
  enable:
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Writer).Write
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*encoding/json.Encoder).Encode
        - os.RemoveAll
        - os.Setenv
        - os.Unsetenv

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104
        - G107
        - G204

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - govet
          - ineffassign
    paths:
      - tests
      - ".*\\.pb\\.go$"
      - ".*zz_generated\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/lokey/client-container

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
